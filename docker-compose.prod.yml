version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: supportgpt_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    container_name: supportgpt_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  qdrant:
    image: qdrant/qdrant
    container_name: supportgpt_qdrant_prod
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: supportgpt_backend_prod
    restart: always
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    container_name: supportgpt_frontend_prod
    restart: always
    env_file:
      - .env.production
    depends_on:
      - backend
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"

  nginx:
    image: nginx:alpine
    container_name: supportgpt_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

networks:
  internal-network:
    name: supportgpt-internal
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
